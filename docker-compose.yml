services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind_forecast_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_DECISION_CUTOFF_TIME=09:50
      - DECISION_START_DATE=2026-01-01
      - DECISION_END_DATE=2026-01-31
      - DELIVERY_START_DATE=2026-01-02
      - DELIVERY_END_DATE=2026-02-01
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wind_forecast_frontend
    ports:
      - "5173:5173"
    environment:
      # Browser-facing address reachable by client
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
